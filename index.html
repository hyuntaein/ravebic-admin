<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVEBIC 관리자</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  overflow:hidden;
}

#adminLockScreen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}

.admin-lock-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
}

.admin-lock-card h2{
  color:#0b3b78;
  margin-bottom:10px;
  font-size:36px;
}

.admin-lock-card p{
  color:#64748b;
  margin-bottom:20px;
}

.admin-lock-card input{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  border-radius:14px;
  border:1px solid #cbd5e1;
  font-size:18px;
  margin-bottom:14px;
}

.admin-lock-card button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.main-wrap{
  padding:30px;
}

.title{
  font-size:42px;
  font-weight:900;
  color:#0b3b78;
}

.desc{
  color:#64748b;
  margin-top:10px;
}

.sample-box{
  margin-top:30px;
  background:white;
  border-radius:20px;
  padding:30px;
  font-size:24px;
}
</style>
</head>

<body>

<div id="adminLockScreen">
  <div class="admin-lock-card">
    <h2>RAVEBIC 관리자</h2>
    <p>관리자 비밀번호를 입력하세요.</p>

    <input id="adminPasswordInput" type="password" placeholder="관리자 비밀번호">

    <button id="adminLoginBtn">관리자 로그인</button>
  </div>
</div>

<div class="main-wrap">

<div class="title">
RAVEBIC 관리자 시스템
</div>

<div class="desc">
로그인 성공 시 관리자 화면이 표시됩니다.
</div>

<div class="sample-box">
✅ 관리자 로그인 성공<br><br>
이 파일을 기존 관리자 index.html 대신 업로드해서 테스트하세요.
</div>

</div>

<script>
const ADMIN_PASSWORD = "482913";

function showAdminPage() {

  const lock = document.getElementById("adminLockScreen");

  if(lock){
    lock.remove();
  }

  document.body.style.overflow = "auto";

  sessionStorage.setItem("ravebicAdminUnlocked","Y");
}

function adminLogin(){

  const pw =
    document.getElementById("adminPasswordInput")
    .value
    .trim();

  if(pw === ADMIN_PASSWORD){

    showAdminPage();

  }else{

    alert("비밀번호가 틀렸습니다.");

  }
}

window.onload = function(){

  if(
    sessionStorage.getItem("ravebicAdminUnlocked")
    === "Y"
  ){
    showAdminPage();
  }

  const btn =
    document.getElementById("adminLoginBtn");

  if(btn){
    btn.onclick = adminLogin;
  }

  const input =
    document.getElementById("adminPasswordInput");

  if(input){

    input.addEventListener("keydown",function(e){

      if(e.key === "Enter"){
        adminLogin();
      }

    });

  }

};
</script>

</body>
</html>
