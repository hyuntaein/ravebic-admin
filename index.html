
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVEBIC 관리자</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}

#adminLockScreen{
  position:fixed;
  inset:0;
  background:#102a66;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loginBox{
  background:white;
  width:360px;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.loginBox h1{
  color:#0b3b78;
}

.loginBox input{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:12px;
  border:1px solid #ccc;
  margin-top:15px;
  box-sizing:border-box;
}

.loginBox button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#errorText{
  color:red;
  margin-top:10px;
  display:none;
}

#mainPage{
  display:none;
  padding:40px;
}

.card{
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<div id="adminLockScreen">
  <div class="loginBox">
    <h1>RAVEBIC 관리자</h1>
    <div>관리자 비밀번호를 입력하세요</div>

    <input type="password" id="pw" placeholder="비밀번호">

    <button onclick="login()">관리자 로그인</button>

    <div id="errorText">비밀번호가 틀렸습니다.</div>
  </div>
</div>

<div id="mainPage">
  <div class="card">
    <h2>로그인 성공</h2>
    <p>여기에 기존 관리자 HTML 내용을 붙여넣으면 됩니다.</p>
    <button onclick="logout()">로그아웃</button>
  </div>
</div>

<script>

const ADMIN_PASSWORD = "482913";

function login(){

  const pw = document.getElementById("pw").value;

  if(pw === ADMIN_PASSWORD){

      localStorage.setItem("ravebic_admin_login","Y");

      document.getElementById("adminLockScreen").style.display = "none";
      document.getElementById("mainPage").style.display = "block";

  }else{

      document.getElementById("errorText").style.display = "block";

  }
}

function logout(){

  localStorage.removeItem("ravebic_admin_login");

  location.reload();

}

window.onload = function(){

   const ok = localStorage.getItem("ravebic_admin_login");

   if(ok === "Y"){

      document.getElementById("adminLockScreen").style.display = "none";
      document.getElementById("mainPage").style.display = "block";

   }

   document.getElementById("pw").addEventListener("keypress",function(e){

      if(e.key === "Enter"){
         login();
      }

   });

}

</script>

</body>
</html>
