<html><body>관리자 파일을 찾지 못했습니다.
<script>
(function(){
  function setupMassMessage(){
    var btn = document.getElementById('massMessageBtn');
    if(!btn) return;
    if(btn.dataset.ready==='Y') return;

    btn.dataset.ready='Y';

    btn.onclick = function(){

      var rows = document.querySelectorAll('tbody tr');
      var targets = [];

      rows.forEach(function(row){

        var select = row.querySelector('select');
        if(!select) return;

        var status = select.value || '';

        if(status === '보안요청' || status === '미확인'){

          var tds = row.querySelectorAll('td');

          if(tds.length >= 3){

            var name = tds[1].innerText.trim();
            var store = tds[2].innerText.trim();

            targets.push(name + ' / ' + store);
          }
        }
      });

      if(targets.length === 0){
        alert('현재 서류 독촉 대상자가 없습니다.');
        return;
      }

      var msg =
        '[RAVEBIC 서류 제출 요청]\n\n' +
        '아직 서류 확인이 완료되지 않았습니다.\n' +
        '서류 확인 및 수정 제출 부탁드립니다.\n\n' +
        '대상자:\n- ' +
        targets.join('\n- ');

      alert(msg);
    };
  }

  document.addEventListener('DOMContentLoaded', setupMassMessage);
  setTimeout(setupMassMessage,1000);
})();
</script>

</body></html>
